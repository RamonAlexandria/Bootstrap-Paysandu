<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paysandu</title>
    <link rel="shortcut icon" href="favicon/favicon.png" type="image/x-icon">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <!-- Meu CSS Próprio -->
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="bg-info text-white m-0 p-0">
<!-- ETAPA 1 — HEADER & NAVBAR (SEM JS) -->
    <header class="navbar navbar-expand-lg navbar-dark px-3 px-lg-5 py-3 w-100 backgroung">
        <!-- 
            Justificativa: 
            Criei um comportamento visual alternativo utilizando a classe obrigatória 'collapse' em conjunto com classes utilitárias de visibilidade e CSS customizado. Isso mantém o menu vertical e visível no mobile e horizontal no desktop, utilizando somente tags semânticas (sem divs).
        -->
        <nav class="container-fluid p-0 d-flex flex-column flex-lg-row justify-content-between align-items-center w-100">
            
            <!-- Logo -->
            <figure class="m-0 area-logo mb-3 mb-lg-0">
                <a class="navbar-brand m-0 p-0" href="#">
                    <img src="images/logo.png" alt="Logo Paysandu" class="logo-paysandu">
                </a>
            </figure>

            <!-- Menu de Navegação (Contém a classe obrigatória collapse) -->
            <section class="collapse show navbar-collapse w-100 w-lg-auto justify-content-end" id="navbarNav">
                <ul class="navbar-nav menu-navegacao mb-0">
                    <li class="nav-item">
                        <a class="nav-link text-white active" aria-current="page" href="#">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#">Serviços</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#">Seja Sócio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#">Sobre</a>
                    </li>
                </ul>
            </section>

        </nav>
    </header>

    <main>
                <!-- ETAPA 2 — HERO SECTION -->
<section class="hero-section text-white py-5">
  <article class="container min-vh-75 py-5">
    <section class="row w-100 justify-content-center align-items-center m-0">
      
      <!-- Texto -->
      <article class="col-12 col-lg-6 text-center order-2 order-lg-1">
        <span class="badge bg-primary mb-3 px-3 py-2 fs-6 shadow-sm">Papão da Curuzu</span>

        <h1 class="display-3 fw-bold text-white mb-3 text-shadow">
          A maior paixão da Amazônia.
        </h1>

        <p class="lead text-light mb-4 text-shadow">
          Viva todas as emoções do Paysandu Sport Club. Fique por dentro de tudo, apoie o time e seja um Sócio Campeão.
        </p>

        <!-- Mantive seus botões -->
        <nav class="d-flex justify-content-center flex-wrap gap-3 mt-4">
          <a href="#" class="btn-solid theme-primary btn btn-primary">Sócio Campeão</a>
          <a href="#" class="btn-outline theme-primary btn2 btn btn-outline-light">Ver Elenco</a>
        </nav>
      </article>

      <!-- Imagem -->
      <figure class="col-12 col-lg-6 order-1 order-lg-2 text-center">
        <img src="images/img.png" alt="Paysandu" class="img-fluid hero-img">
      </figure>

    </section>
  </article>
</section>
    </main>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</body>
</html>
