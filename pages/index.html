<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paysandu</title>
    <link rel="shortcut icon" href="../favicon/favicon.png" type="image/x-icon">
    <!-- Só importei o Bootstrap CSS, pois a atividade proíbe o JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <!-- Meu CSS Próprio -->
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
<!-- ETAPA 1 — HEADER & NAVBAR (SEM JS) -->
<header class="bg-primary navbar-dark px-4 py-3 w-100">
        <!-- 
          Desafio sem JS e sem DIV: Utilizamos classes utilitárias do flexbox do Bootstrap 
          (d-flex, justify-content-between, align-items-center, flex-row) aplicadas 
          diretamente na tag semântica <nav> para manter a logo à esquerda e o menu 
          horizontal à direita em telas desktop, sem precisar de wrappers em div ou scripts JS.
        -->
        <nav class="d-flex flex-row justify-content-between align-items-center w-100">
            
            <!-- Logo alinhada à esquerda -->
            <figure class="m-0">
                <a class="navbar-brand m-0" href="#">
                    <img src="../images/logo.png" alt="Logo Paysandu" height="40">
                </a>
            </figure>

            <!-- Menu de Navegação Horizontal -->
            <ul class="navbar-nav d-flex flex-row gap-4 mb-0">
                <li class="nav-item">
                    <a class="nav-link text-white active" aria-current="page" href="#">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="#">Serviços</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="#">Seja Sócio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" href="#">Sobre</a>
                </li>
            </ul>

        </nav>
    </header>
</body>
</html>
